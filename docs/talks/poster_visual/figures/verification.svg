<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" font-family="'Times New Roman', Times, serif"><rect width="1400" height="590" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect x="10" y="10" width="1380" height="104" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="4"/><text x="40" y="56" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="start">One cache</text><text x="40" y="98" font-size="32" font-weight="400" fill="#52514e" text-anchor="start">random traffic vs reference memory</text><text x="1360" y="82" font-size="60" font-weight="700" fill="#2a78d6" text-anchor="end">300 / 300</text><rect x="40" y="126" width="1350" height="104" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="4"/><text x="70" y="172" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="start">Two caches + bus + CA</text><text x="70" y="214" font-size="32" font-weight="400" fill="#52514e" text-anchor="start">models of MSI and of the CA rules</text><text x="1360" y="198" font-size="60" font-weight="700" fill="#2a78d6" text-anchor="end">400 / 400</text><rect x="70" y="242" width="1320" height="104" rx="8" fill="#fdf3d9" stroke="#eda100" stroke-width="4"/><text x="100" y="288" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="start">Injected bugs</text><text x="100" y="330" font-size="32" font-weight="400" fill="#52514e" text-anchor="start">does the testbench catch them?</text><text x="1360" y="314" font-size="60" font-weight="700" fill="#eda100" text-anchor="end">26 / 27</text><rect x="100" y="358" width="1290" height="104" rx="8" fill="#e3f5ee" stroke="#1baf7a" stroke-width="4"/><text x="130" y="404" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="start">Full processor</text><text x="130" y="446" font-size="32" font-weight="400" fill="#52514e" text-anchor