<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="'Times New Roman', Times, serif"><rect width="1400" height="860" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="10" y="48" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="start">AMD KR260 FPGA, 50 MHz</text><rect x="10" y="75" width="680" height="470" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="4"/><text x="35" y="128" font-size="38" font-weight="700" fill="#2a78d6" text-anchor="start">CVA6 core 0 (RV32IMAC)</text><rect x="30" y="150" width="640" height="118" rx="8" fill="#e8f1fc"/><text x="350.0" y="203.1" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">In-order pipeline</text><text x="350.0" y="246.76" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">+ cread, cwrite, untagOne, untagAll</text><rect x="30" y="283" width="640" height="118" rx="8" fill="#fdece4"/><text x="350.0" y="336.1" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">CA unit (new)</text><text x="350.0" y="379.76" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">8-line tag set, revoked on snoop / evict / trap</text><rect x="30" y="416" width="640" height="118" rx="8" fill="#e3f5ee"/><text x="350.0" y="469.1" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">L1 data cache, MSI (new)</text><text x="350.0" y="512.76" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">write-back 32 KiB, atomics in the L1</text><line x1="350" y1="547" x2="350" y2="588" stroke="#52514e" stroke-width="5" marker-start="url(#a)" marker-end="url(#a)"/><rect x="710" y="75" width="680" height="470" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="4"/><text x="735" y="128" font-size="38" font-weight="700" fill="#2a78d6" text-anchor="start">CVA6 core 1 (RV32IMAC)</text><rect x="730" y="150" width="640" height="118" rx="8" fill="#e8f1fc"/><text x="1050.0" y="203.1" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">In-order pipeline</text><text x="1050.0" y="246.76" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">+ cread, cwrite, untagOne, untagAll</text><rect x="730" y="283" width="640" height="118" rx="8" fill="#fdece4"/><text x="1050.0" y="336.1" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">CA unit (new)</text><text x="1050.0" y="379.76" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">8-line tag set, revoked on snoop / evict / trap</text><rect x="730" y="416" width="640" height="118" rx="8" fill="#e3f5ee"/><text x="1050.0" y="469.1" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">L1 data cache, MSI (new)</text><text x="1050.0" y="512.76" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">write-back 32 KiB, atomics in the L1</text><line x1="1050" y1="547" x2="1050" y2="588" stroke="#52514e" stroke-width="5" marker-start="url(#a)" marker-end="url(#a)"/><rect x="10" y="590" width="1380" height="118" rx="8" fill="#1baf7a"/><text x="700" y="642" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">Coherence bus (new): snooping, one transaction at a time</text><text x="700" y="690" font-size="30" font-weight="400" fill="#ffffff" text-anchor="middle">GetS / GetM / PutM; dirty data written back before the grant</text><line x1="450" y1="710" x2="450" y2="745" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><rect x="10" y="750" width="880" height="105" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><text x="450.0" y="797.25" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">AXI4 to PS DDR4 memory (no L2)</text><text x="450.0" y="836.1" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">programs and data</text><rect x="910" y="750" width="480" height="105" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><text x="1150.0" y="797.25" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">Mailbox + JTAG host</text><text x="1150.0" y="836.1" font-size="29" font-weight="400" fill="#52514e" text-anchor="middle">load programs, read results</text></svg>