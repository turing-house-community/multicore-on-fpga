<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" font-family="'Times New Roman', Times, serif"><rect width="700" height="420" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="10" y="38" font-size="28" font-weight="700" fill="#2a78d6">Core 0 (reader)</text><text x="10" y="232" font-size="28" font-weight="700" fill="#eb6834">Core 1 (remover)</text><rect x="10" y="56" width="290" height="96" rx="5" fill="#e8f1fc"/><text x="155.0" y="98.24000000000001" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">p = cread(…)</text><text x="155.0" y="132.8" text-anchor="middle" font-size="25" fill="#52514e">line is watched</text><rect x="160" y="250" width="250" height="96" rx="5" fill="#fdece4"/><text x="285.0" y="292.24" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">unlink N</text><text x="285.0" y="326.8" text-anchor="middle" font-size="25" fill="#52514e">a write to N's line</text><rect x="430" y="250" width="260" height="96" rx="5" fill="#fdece4"/><text x="560.0" y="292.24" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">free(N)</text><text x="560.0" y="326.8" text-anchor="middle" font-size="25" fill="#52514e">immediately</text><rect x="400" y="56" width="290" height="96" rx="5" fill="#e3f5ee" stroke="#1baf7a" stroke-width="4"/><text x="545.0" y="98.24000000000001" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">cread(p→key)</text><text x="545.0" y="132.8" text-anchor="middle" font-size="25" fill="#0d6b4a" font-weight="700">fails, so it retries</text><path d="M285,248 C300,200 400,175 500,156" fill="none" stroke="#52514e" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a)"/><text x="455" y="222" font-size="26" font-weight="600" fill="#52514e">access revoked</text><line x1="10" y1="392" x2="690" y2="392" stroke="#c3c2b7" stroke-width="3" marker-end="url(#a)"/><text x="680" y="380" font-size="24" fill="#898781" text-anchor="end">time</text></svg>