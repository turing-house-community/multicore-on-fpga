<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'Times New Roman', Times, serif"><rect width="1400" height="560" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect x="10" y="10" width="680" height="430" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="4"/><text x="40" y="70" font-size="46" font-weight="700" fill="#2a78d6" text-anchor="start">Hazard pointers</text><rect x="40" y="110" width="190" height="90" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="3"/><text x="135" y="168" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="middle">announce p</text><rect x="270" y="110" width="160" height="90" rx="8" fill="#fdf3d9" stroke="#52514e" stroke-width="3"/><text x="350" y="168" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="middle">fence</text><rect x="470" y="110" width="190" height="90" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="3"/><text x="565" y="168" font-size="36" font-weight="600" fill="#0b0b0b" text-anchor="middle">read *p</text><line x1="232" y1="155" x2="266" y2="155" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><line x1="432" y1="155" x2="466" y2="155" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><text x="345" y="245" font-size="32" font-weight="400" fill="#898781" text-anchor="middle">on every pointer read</text><text x="40" y="320.0" font-size="38" font-weight="600" fill="#e34948" text-anchor="start">Problem: a memory fence on</text><text x="40" y="367.5" font-size="38" font-weight="600" fill="#e34948" text-anchor="start">every read slows traversals</text><rect x="710" y="10" width="680" height="430" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="4"/><text x="740" y="70" font-size="46" font-weight="700" fill="#eb6834" text-anchor="start">Epoch-based (EBR)</text><rect x="750" y="110" width="52" height="52" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><rect x="812" y="122" width="52" height="52" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><rect x="874" y="110" width="52" height="52" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><rect x="936" y="122" width="52" height="52" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><rect x="998" y="110" width="52" height="52" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><rect x="1060" y="122" width="52" height="52" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="3"/><text x="1150" y="148" font-size="34" font-weight="600" fill="#0b0b0b" text-anchor="start">removed,</text><text x="1150" y="188" font-size="34" font-weight="600" fill="#0b0b0b" text-anchor="start">waiting</text><text x="1045" y="245" font-size="30" font-weight="400" fill="#898781" text-anchor="middle">freed only after every thread passes a checkpoint</text><text x="740" y="320.0" font-size="38" font-weight="600" fill="#e34948" text-anchor="start">Problem: unfreed memory piles</text><text x="740" y="367.5" font-size="38" font-weight="600" fill="#e34948" text-anchor="start">up, without bound if a thread stalls</text><rect x="10" y="460" width="1380" height="90" rx="8" fill="#1f3a5f"/><text x="700" y="520" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">Both delay reclamation: they trade speed against memory</text></svg>