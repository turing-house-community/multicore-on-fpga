<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="538" viewBox="0 0 1400 538" font-family="'Times New Roman', Times, serif"><rect width="1400" height="538" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="4" y="4" width="688" height="52" rx="26" fill="#1f3a5f"/><text x="348.0" y="40" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">What we had to solve</text><rect x="4" y="66" width="688" height="108" rx="14" fill="#f6f8fb" stroke="#d5deea" stroke-width="2"/><g transform="translate(20,82) scale(0.5)" fill="none" stroke="#1f3a5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M22,44 A30,30 0 0 1 76,34"/><path d="M78,56 A30,30 0 0 1 24,66"/><path d="M66,22 L78,34 L64,42"/><path d="M34,78 L22,66 L36,58"/></g><text x="86" y="102" font-size="27" fill="#1f3a5f" text-anchor="start" font-weight="700">Deadlock</text><text x="86" y="134" font-size="24" fill="#52514e" text-anchor="start">A cache always answers the other cache</text><text x="86" y="162" font-size="24" fill="#52514e" text-anchor="start">without waiting for anything itself.</text><rect x="4" y="186" width="688" height="108" rx="14" fill="#f6f8fb" stroke="#d5deea" stroke-width="2"/><g transform="translate(20,202) scale(0.5)" fill="none" stroke="#1f3a5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="46" width="56" height="42" rx="6"/><path d="M34,46 V32 A16,16 0 0 1 66,32 V46"/><path d="M50,62 V72"/></g><text x="86" y="222" font-size="27" fill="#1f3a5f" text-anchor="start" font-weight="700">Atomic cwrite</text><text x="86" y="254" font-size="24" fill="#52514e" text-anchor="start">Check and store happen together, at commit,</text><text x="86" y="282" font-size="24" fill="#52514e" text-anchor="start">with the line held exclusively.</text><rect x="4" y="306" width="688" height="108" rx="14" fill="#f6f8fb" stroke="#d5deea" stroke-width="2"/><g transform="translate(20,322) scale(0.5)" fill="none" stroke="#1f3a5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="40"/><path d="M50,26 V50 L66,62"/></g><text x="86" y="342" font-size="27" fill="#1f3a5f" text-anchor="start" font-weight="700">Speculation</text><text x="86" y="374" font-size="24" fill="#52514e" text-anchor="start">CA operations take effect only when</text><text x="86" y="402" font-size="24" fill="#52514e" text-anchor="start">the instruction commits.</text><rect x="4" y="426" width="688" height="108" rx="14" fill="#f6f8fb" stroke="#d5deea" stroke-width="2"/><g transform="translate(20,442) scale(0.5)" fill="none" stroke="#1f3a5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M30,88 V14"/><path d="M30,60 C30,40 70,46 70,22"/><path d="M58,30 L70,16 L82,30"/><path d="M18,26 L30,12 L42,26"/></g><text x="86" y="462" font-size="27" fill="#1f3a5f" text-anchor="start" font-weight="700">No flag register in RISC-V</text><text x="86" y="494" font-size="24" fill="#52514e" text-anchor="start">The paper assumes x86 EFLAGS; we added a</text><text x="86" y="522" font-size="24" fill="#52514e" text-anchor="start">branch instruction instead: bcafail.</text><rect x="712" y="4" width="688" height="52" rx="26" fill="#a8431c"/><text x="1056.0" y="40" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">What we learned</text><rect x="712" y="66" width="688" height="108" rx="14" fill="#fdf6f2" stroke="#d5deea" stroke-width="2"/><g transform="translate(728,82) scale(0.5)" fill="none" stroke="#a8431c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M50,12 L86,30 V70 L50,88 L14,70 V30 Z"/><path d="M14,30 L50,48 L86,30 M50,48 V88"/></g><text x="794" y="102" font-size="27" fill="#a8431c" text-anchor="start" font-weight="700">Don't trust stale repositories</text><text x="794" y="134" font-size="24" fill="#52514e" text-anchor="start">OpenPiton (an old CVA6) failed us, so we built</text><text x="794" y="162" font-size="24" fill="#52514e" text-anchor="start">our own MSI caches, directory and L2.</text><rect x="712" y="186" width="688" height="108" rx="14" fill="#fdf6f2" stroke="#d5deea" stroke-width="2"/><g transform="translate(728,202) scale(0.5)" fill="none" stroke="#a8431c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="24" width="52" height="52" rx="6"/><rect x="38" y="38" width="24" height="24" rx="3"/><path d="M36,24 V10 M36,76 V90 M24,36 H10 M76,36 H90"/><path d="M50,24 V10 M50,76 V90 M24,50 H10 M76,50 H90"/><path d="M64,24 V10 M64,76 V90 M24,64 H10 M76,64 H90"/></g><text x="794" y="222" font-size="27" fill="#a8431c" text-anchor="start" font-weight="700">Hardware is finite</text><text x="794" y="254" font-size="24" fill="#52514e" text-anchor="start">117k LUTs fit 2 cores, so 32-bit RISC-V. Tooling:</text><text x="794" y="282" font-size="24" fill="#52514e" text-anchor="start">Vivado 2023.2 licence, JTAG, Windows + WSL.</text><rect x="712" y="306" width="688" height="108" rx="14" fill="#fdf6f2" stroke="#d5deea" stroke-width="2"/><g transform="translate(728,322) scale(0.5)" fill="none" stroke="#a8431c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="50" cy="56" rx="20" ry="27"/><circle cx="50" cy="24" r="10"/><path d="M50,32 V82"/><path d="M30,46 L14,38 M30,60 H12 M31,74 L16,84 M70,46 L86,38 M70,60 H88 M69,74 L84,84"/></g><text x="794" y="342" font-size="27" fill="#a8431c" text-anchor="start" font-weight="700">Simulators can hide bugs</text><text x="794" y="374" font-size="24" fill="#52514e" text-anchor="start">An L2 handshake bug showed only on the board;</text><text x="794" y="402" font-size="24" fill="#52514e" text-anchor="start">after the fix, simulator = board exactly.</text><rect x="712" y="426" width="688" height="108" rx="14" fill="#fdf6f2" stroke="#d5deea" stroke-width="2"/><g transform="translate(728,442) scale(0.5)" fill="none" stroke="#a8431c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M12,88 H90"/><rect x="20" y="52" width="14" height="36"/><rect x="44" y="30" width="14" height="58"/><rect x="68" y="14" width="14" height="74"/></g><text x="794" y="462" font-size="27" fill="#a8431c" text-anchor="start" font-weight="700">Faster is not always better</text><text x="794" y="494" font-size="24" fill="#52514e" text-anchor="start">Epochs win read-heavy speed, CA keeps 0 nodes</text><text x="794" y="522" font-size="24" fill="#52514e" text-anchor="start">waiting; adding the L2 changed the answer.</text></svg>