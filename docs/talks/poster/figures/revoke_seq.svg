<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" font-family="'Times New Roman', Times, serif"><rect width="1400" height="500" fill="#EEF3F9"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="20" y="6" width="340" height="64" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="4"/><text x="190.0" y="48.5" font-size="30" fill="#0b0b0b" text-anchor="middle" font-weight="600">Core 0 (reader)</text><line x1="190" y1="70" x2="190" y2="490" stroke="#c3c2b7" stroke-width="3" stroke-dasharray="4 8"/><rect x="530" y="6" width="340" height="64" rx="8" fill="#e3f5ee" stroke="#0d6b4a" stroke-width="4"/><text x="700.0" y="48.5" font-size="30" fill="#0b0b0b" text-anchor="middle" font-weight="600">Directory</text><line x1="700" y1="70" x2="700" y2="490" stroke="#c3c2b7" stroke-width="3" stroke-dasharray="4 8"/><rect x="1040" y="6" width="340" height="64" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="4"/><text x="1210.0" y="48.5" font-size="30" fill="#0b0b0b" text-anchor="middle" font-weight="600">Core 1 (remover)</text><line x1="1210" y1="70" x2="1210" y2="490" stroke="#c3c2b7" stroke-width="3" stroke-dasharray="4 8"/><circle cx="40" cy="110" r="20" fill="#1f3a5f"/><text x="40" y="119" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><line x1="190" y1="118" x2="696" y2="118" stroke="#2a78d6" stroke-width="4" marker-end="url(#b)"/><text x="445.0" y="104" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="600">cread(N): read and watch N</text><text x="716" y="148" font-size="24" fill="#52514e" text-anchor="start" font-style="italic">notes: core 0 has a copy of N</text><circle cx="1360" cy="188" r="20" fill="#1f3a5f"/><text x="1360" y="197" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><line x1="1210" y1="196" x2="704" y2="196" stroke="#eb6834" stroke-width="4" marker-end="url(#o)"/><text x="955.0" y="182" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="600">unlink N: wants to write N</text><circle cx="40" cy="264" r="20" fill="#1f3a5f"/><text x="40" y="273" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><line x1="700" y1="272" x2="194" y2="272" stroke="#e34948" stroke-width="4" marker-end="url(#r)"/><text x="445.0" y="258" font-size="26" fill="#e34948" text-anchor="middle" font-weight="700">invalidate your copy of N</text><rect x="15" y="286" width="350" height="66" rx="8" fill="#fbe1e1" stroke="#e34948" stroke-width="4"/><text x="190.0" y="315.7" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="600">access revoked</text><text x="190.0" y="338.8" font-size="22" fill="#52514e" text-anchor="middle">the CA unit remembers</text><line x1="700" y1="350" x2="1206" y2="350" stroke="#0d6b4a" stroke-width="4" marker-end="url(#g)"/><text x="955.0" y="336" font-size="26" fill="#0d6b4a" text-anchor="middle" font-weight="600">go ahead</text><rect x="1060" y="364" width="300" height="58" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="4"/><text x="1210.0" y="402.1" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="600">free(N), at once</text><circle cx="40" cy="450" r="20" fill="#1f3a5f"/><text x="40" y="459" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><rect x="70" y="418" width="560" height="64" rx="8" fill="#e3f5ee" stroke="#1baf7a" stroke-width="4"/><text x="350.0" y="459.45" font-size="27" fill="#0b0b0b" text-anchor="middle" font-weight="600">next cread / bcafail fails → retry</text><text x="650" y="460" font-size="26" fill="#0d6b4a" text-anchor="start" font-weight="700">never touches freed N</text></svg>