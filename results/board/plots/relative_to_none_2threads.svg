<svg xmlns="http://www.w3.org/2000/svg" width="980" height="384" viewBox="0 0 980 384" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title id="t">Throughput relative to the leaky baseline, 2 threads</title><desc id="d">For each data structure and update rate, the throughput of ca, hp and qsbr divided by the throughput of none, with 2 threads. A value above 1 is faster than none.</desc>
<rect width="980" height="384" fill="#fcfcfb"/>
<text x="20" y="26" font-size="16" font-weight="600" fill="#0b0b0b">Throughput relative to none (leaky), 2 threads</text>
<text x="20" y="44" font-size="12" fill="#52514e">Each scheme divided by none for the same workload; the line marks none = 1.0. Above the line is faster than leaking memory.</text>
