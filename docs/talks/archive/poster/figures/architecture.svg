<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="770" viewBox="0 0 1400 770" font-family="'Times New Roman', Times, serif"><rect width="1400" height="770" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="20" y="46" font-size="34" font-weight="700" fill="#0b0b0b">AMD KR260 FPGA, 50 MHz</text><rect x="20" y="70" width="660" height="390" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="4"/><text x="50" y="122" font-size="34" font-weight="700" fill="#2a78d6">CVA6 core 0 (RV32IMAC)</text><rect x="45" y="145" width="610" height="92" rx="5" fill="#e8f1fc"/><text x="350.0" y="185.48" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">In-order pipeline</text><text x="350.0" y="218.60000000000002" text-anchor="middle" font-size="25" fill="#52514e">adds cread, cwrite, untagOne, untagAll</text><rect x="45" y="250" width="610" height="92" rx="5" fill="#fdece4"/><text x="350.0" y="290.48" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">CA unit (new)</text><text x="350.0" y="323.6" text-anchor="middle" font-size="25" fill="#52514e">8-line tag set; revoked on snoop, eviction, trap</text><rect x="45" y="355" width="610" height="92" rx="5" fill="#e3f5ee"/><text x="350.0" y="395.48" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">L1 data cache with MSI (new)</text><text x="350.0" y="428.6" text-anchor="middle" font-size="25" fill="#52514e">write-back, 32 KiB; atomics run in the L1</text><rect x="720" y="70" width="660" height="390" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="4"/><text x="750" y="122" font-size="34" font-weight="700" fill="#2a78d6">CVA6 core 1 (RV32IMAC)</text><rect x="745" y="145" width="610" height="92" rx="5" fill="#e8f1fc"/><text x="1050.0" y="185.48" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">In-order pipeline</text><text x="1050.0" y="218.60000000000002" text-anchor="middle" font-size="25" fill="#52514e">adds cread, cwrite, untagOne, untagAll</text><rect x="745" y="250" width="610" height="92" rx="5" fill="#fdece4"/><text x="1050.0" y="290.48" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">CA unit (new)</text><text x="1050.0" y="323.6" text-anchor="middle" font-size="25" fill="#52514e">8-line tag set; revoked on snoop, eviction, trap</text><rect x="745" y="355" width="610" height="92" rx="5" fill="#e3f5ee"/><text x="1050.0" y="395.48" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">L1 data cache with MSI (new)</text><text x="1050.0" y="428.6" text-anchor="middle" font-size="25" fill="#52514e">write-back, 32 KiB; atomics run in the L1</text><line x1="350" y1="462" x2="350" y2="500" stroke="#52514e" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/><line x1="1050" y1="462" x2="1050" y2="500" stroke="#52514e" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/><rect x="20" y="502" width="1360" height="100" rx="6" fill="#1baf7a"/><text x="700" y="545" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Coherence bus (new): snooping, one transaction at a time</text><text x="700" y="583" text-anchor="middle" font-size="26" fill="#ffffff">GetS / GetM / PutM; dirty data is written back before the grant</text><line x1="450" y1="604" x2="450" y2="640" stroke="#52514e" stroke-width="4" marker-end="url(#a)"/><rect x="20" y="642" width="880" height="108" rx="5" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="4"/><text x="460.0" y="689.52" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">AXI4 → PS DDR4 memory (no L2)</text><text x="460.0" y="728.4" text-anchor="middle" font-size="25" fill="#52514e">core 0x8000_0000 → DDR 0x4000_0000</text><rect x="940" y="642" width="440" height="108" rx="5" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="4"/><text x="1160.0" y="689.52" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0b0b">Mailbox and host (JTAG)</text><text x="1160.0" y="728.4" text-anchor="middle" font-size="25" fill="#52514e">loads programs, reads results</text></svg>