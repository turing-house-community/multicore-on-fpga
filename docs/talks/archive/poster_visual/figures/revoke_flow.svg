<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'Times New Roman', Times, serif"><rect width="1400" height="600" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="20" y="50" font-size="38" font-weight="700" fill="#eb6834" text-anchor="start">Core 1 (remover)</text><text x="20" y="560" font-size="38" font-weight="700" fill="#2a78d6" text-anchor="start">Core 0 (reader)</text><rect x="20" y="75" width="420" height="130" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="4"/><text x="230" y="130" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="middle">1. writes node N</text><text x="230" y="180" font-size="32" font-weight="400" fill="#52514e" text-anchor="middle">unlink / mark</text><rect x="480" y="75" width="420" height="130" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="4"/><text x="690" y="130" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="middle">2. needs line in M</text><text x="690" y="180" font-size="32" font-weight="400" fill="#52514e" text-anchor="middle">GetM on the bus</text><line x1="442" y1="140" x2="476" y2="140" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><rect x="20" y="255" width="1360" height="90" rx="8" fill="#1baf7a"/><text x="700" y="312" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">coherence bus: snoop GetM(N) to the other cache</text><line x1="690" y1="207" x2="690" y2="252" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><rect x="20" y="395" width="420" height="130" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="4"/><text x="230" y="450" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">3. copy of N invalidated</text><text x="230" y="500" font-size="32" font-weight="400" fill="#52514e" text-anchor="middle">it was tagged by cread</text><rect x="480" y="395" width="420" height="130" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="4"/><text x="690" y="450" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">4. CA unit: access revoked</text><text x="690" y="500" font-size="32" font-weight="400" fill="#52514e" text-anchor="middle">accessRevokedBit = 1</text><rect x="940" y="395" width="420" height="130" rx="8" fill="#e3f5ee" stroke="#1baf7a" stroke-width="4"/><text x="1150" y="450" font-size="36" font-weight="700" fill="#0b0b0b" text-anchor="middle">5. next cread fails</text><text x="1150" y="500" font-size="32" font-weight="400" fill="#52514e" text-anchor="middle">reader retries, never uses N</text><line x1="230" y1="348" x2="230" y2="391" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><line x1="442" y1="460" x2="476" y2="460" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><line x1="902" y1="460" x2="936" y2="460" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/><rect x="940" y="75" width="440" height="130" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="4"/><text x="1160" y="130" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="middle">free(N) immediately</text><text x="1160" y="180" font-size="32" font-weight="400" fill="#52514e" text-anchor="middle">no waiting, no scan</text><line x1="902" y1="140" x2="936" y2="140" stroke="#52514e" stroke-width="5" marker-end="url(#a)"/></svg>