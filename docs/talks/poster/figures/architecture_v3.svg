<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="'Times New Roman', Times, serif"><rect width="1400" height="900" fill="#EEF3F9"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><text x="20" y="46" font-size="34" fill="#0b0b0b" text-anchor="start" font-weight="700">AMD KR260 FPGA, 50 MHz</text><rect x="20" y="70" width="660" height="390" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="4"/><text x="50" y="122" font-size="34" fill="#2a78d6" text-anchor="start" font-weight="700">CVA6 core 0 (RV32IMAC)</text><rect x="45" y="145" width="610" height="92" rx="5" fill="#e8f1fc"/><text x="350.0" y="186.4" font-size="32" fill="#0b0b0b" text-anchor="middle" font-weight="600">In-order pipeline</text><text x="350.0" y="218.60000000000002" font-size="28" fill="#52514e" text-anchor="middle">+ cread, cwrite, untagOne, untagAll, bcafail</text><rect x="45" y="250" width="610" height="92" rx="5" fill="#fdece4"/><text x="350.0" y="291.4" font-size="32" fill="#0b0b0b" text-anchor="middle" font-weight="600">CA unit</text><text x="350.0" y="323.6" font-size="28" fill="#52514e" text-anchor="middle">8-line tag set; revoked on snoop, eviction, trap</text><rect x="45" y="355" width="610" height="92" rx="5" fill="#e3f5ee"/><text x="350.0" y="396.4" font-size="32" fill="#0b0b0b" text-anchor="middle" font-weight="600">L1 data cache with MSI</text><text x="350.0" y="428.6" font-size="28" fill="#52514e" text-anchor="middle">write-back, 32 KiB; atomics run in the L1</text><rect x="720" y="70" width="660" height="390" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="4"/><text x="750" y="122" font-size="34" fill="#2a78d6" text-anchor="start" font-weight="700">CVA6 core 1 (RV32IMAC)</text><rect x="745" y="145" width="610" height="92" rx="5" fill="#e8f1fc"/><text x="1050.0" y="186.4" font-size="32" fill="#0b0b0b" text-anchor="middle" font-weight="600">In-order pipeline</text><text x="1050.0" y="218.60000000000002" font-size="28" fill="#52514e" text-anchor="middle">+ cread, cwrite, untagOne, untagAll, bcafail</text><rect x="745" y="250" width="610" height="92" rx="5" fill="#fdece4"/><text x="1050.0" y="291.4" font-size="32" fill="#0b0b0b" text-anchor="middle" font-weight="600">CA unit</text><text x="1050.0" y="323.6" font-size="28" fill="#52514e" text-anchor="middle">8-line tag set; revoked on snoop, eviction, trap</text><rect x="745" y="355" width="610" height="92" rx="5" fill="#e3f5ee"/><text x="1050.0" y="396.4" font-size="32" fill="#0b0b0b" text-anchor="middle" font-weight="600">L1 data cache with MSI</text><text x="1050.0" y="428.6" font-size="28" fill="#52514e" text-anchor="middle">write-back, 32 KiB; atomics run in the L1</text><line x1="350" y1="462" x2="350" y2="500" stroke="#52514e" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/><line x1="1050" y1="462" x2="1050" y2="500" stroke="#52514e" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/><rect x="20" y="502" width="1360" height="100" rx="6" fill="#1baf7a"/><text x="700" y="545" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">Coherence directory: records which cache holds each line</text><text x="700" y="585" font-size="28" fill="#ffffff" text-anchor="middle">snoops only the holders; misses to different lines proceed in parallel</text><line x1="450" y1="604" x2="450" y2="640" stroke="#52514e" stroke-width="4" marker-end="url(#a)"/><rect x="20" y="642" width="1360" height="100" rx="6" fill="#1f3a5f"/><text x="700" y="685" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">Shared L2 cache, 256 KiB</text><text x="700" y="725" font-size="28" fill="#dfe7f1" text-anchor="middle">64 B lines, 8-way, keeps serving hits while misses wait</text><line x1="450" y1="744" x2="450" y2="780" stroke="#52514e" stroke-width="4" marker-end="url(#a)"/><rect x="20" y="782" width="880" height="100" rx="6" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="4"/><text x="460.0" y="827.0" font-size="30" fill="#0b0b0b" text-anchor="middle" font-weight="600">PS DDR4 main memory (the ARM side)</text><text x="460.0" y="862.0" font-size="27" fill="#52514e" text-anchor="middle">core 0x8000_0000 → DDR 0x4000_0000</text><rect x="940" y="782" width="440" height="100" rx="6" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="4"/><text x="1160.0" y="827.0" font-size="30" fill="#0b0b0b" text-anchor="middle" font-weight="600">Mailbox + host (JTAG)</text><text x="1160.0" y="862.0" font-size="27" fill="#52514e" text-anchor="middle">loads programs, reads results</text></svg>