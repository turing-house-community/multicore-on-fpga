<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="'Times New Roman', Times, serif"><rect width="1400" height="600" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect x="10" y="10" width="680" height="182" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><rect x="10" y="10" width="14" height="182" rx="4" fill="#1f3a5f"/><text x="50" y="66" font-size="42" font-weight="700" fill="#1f3a5f" text-anchor="start">Choosing a base</text><text x="50" y="118.0" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">OpenPiton dropped: old CVA6,</text><text x="50" y="160.5" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">heavy, needs an L1.5 adapter</text><rect x="710" y="10" width="680" height="182" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><rect x="710" y="10" width="14" height="182" rx="4" fill="#1f3a5f"/><text x="750" y="66" font-size="42" font-weight="700" fill="#1f3a5f" text-anchor="start">Fitting the FPGA</text><text x="750" y="118.0" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">limited LUTs: moved to</text><text x="750" y="160.5" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">32-bit RV32 cores</text><rect x="10" y="207" width="680" height="182" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><rect x="10" y="207" width="14" height="182" rx="4" fill="#1f3a5f"/><text x="50" y="263" font-size="42" font-weight="700" fill="#1f3a5f" text-anchor="start">Deadlock freedom</text><text x="50" y="315.0" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">a cache answers a snoop</text><text x="50" y="357.5" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">without needing the bus</text><rect x="710" y="207" width="680" height="182" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><rect x="710" y="207" width="14" height="182" rx="4" fill="#1f3a5f"/><text x="750" y="263" font-size="42" font-weight="700" fill="#1f3a5f" text-anchor="start">Atomic cwrite</text><text x="750" y="315.0" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">runs at commit, holding</text><text x="750" y="357.5" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">the line exclusively</text><rect x="10" y="404" width="680" height="182" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><rect x="10" y="404" width="14" height="182" rx="4" fill="#1f3a5f"/><text x="50" y="460" font-size="42" font-weight="700" fill="#1f3a5f" text-anchor="start">Speculation</text><text x="50" y="512.0" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">CA ops recorded at issue,</text><text x="50" y="554.5" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">applied only at commit</text><rect x="710" y="404" width="680" height="182" rx="8" fill="#f3f3f0" stroke="#c3c2b7" stroke-width="3"/><rect x="710" y="404" width="14" height="182" rx="4" fill="#1f3a5f"/><text x="750" y="460" font-size="42" font-weight="700" fill="#1f3a5f" text-anchor="start">Learning curve</text><text x="750" y="512.0" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">CVA6, KR260 and Vivado,</text><text x="750" y="554.5" font-size="34" font-weight="400" fill="#52514e" text-anchor="start">coherence, reclamation</text></svg>